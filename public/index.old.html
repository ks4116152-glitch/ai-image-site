<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Generator</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      box-sizing: border-box;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>✨ AI Image Generator</h1>

  <p>Apna prompt likho</p>

  <textarea
    id="prompt"
    placeholder="Example: A cute cat on the moon...">
  </textarea>

  <button onclick="generateImage()">
    🎨 Generate Image
  </button>

  <p id="status"></p>

  <img id="result" style="width:100%;border-radius:12px;">

</div>

<script>

async function generateImage() {

  const prompt = document.getElementById("prompt").value;
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!prompt.trim()) {
    status.innerText = "Please enter a prompt!";
    return;
  }

  status.innerText = "⏳ Generating...";

  try {

    const response = await fetch("/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt: prompt })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error);
    }

    result.src = data.image;
    status.innerText = "✅ Done!";

  } catch (error) {

    status.innerText = "❌ " + error.message;

  }
}

</script>

</body>
</html>
